name: Daily Airfare Scrape & CPI Index Update

on:
  schedule:
    # Runs at 09:00 AM IST daily (IST is UTC + 5:30 -> 03:30 AM UTC)
    - cron: '30 3 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions web tab anytime

jobs:
  scrape-and-update:
    name: Scrape Flights & Update Indices
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium with System Dependencies
        run: |
          playwright install --with-deps chromium

      - name: Run Airfare Scraper (DEL -> HYD)
        run: |
          python run_scraper.py --origin DEL --dest HYD --headless

      - name: Calculate CPI Indices & Update Dashboard
        run: |
          python calculate_index.py

      - name: Update Scheduler Logs
        run: |
          mkdir -p logs
          echo "===================================================" >> data/scheduler_output.log
          echo "Cloud run completed at $(date -u) UTC" >> data/scheduler_output.log
          echo "===================================================" >> data/scheduler_output.log
          cp data/scheduler_output.log logs/scheduler_output.log

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ logs/
          if git diff --staged --quiet; then
            echo "No new flight records or changes to commit."
          else
            git commit -m "Automated daily scrape & CPI index update [$(date +'%Y-%m-%d')]"
            git push
          fi
